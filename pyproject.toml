[project]
name = "voiceguard"
version = "0.1.0"
description = "AI-powered voice-clone detection for real-time fraud prevention"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "openai>=1.50.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "silero-vad>=5.1.2",
    "praat-parselmouth>=0.4.3",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
]

[project.scripts]
start-backend = "backend.main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "ai_ml"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121" }
]
torchaudio = [
  { index = "pytorch-cu121" }
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
